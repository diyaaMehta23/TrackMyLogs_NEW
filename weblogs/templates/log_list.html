{% extends "base.html" %}

{% block title %}Log List{% endblock %}

{% block extra_styles %}
<style>
    @media (max-width: 768px) {
        table thead {
            display: none;
        }

        table tr {
            display: block;
            margin-bottom: 1rem;
        }

        table td {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid #ddd;
        }

        table td:last-child {
            border-bottom: none;
        }

        table td[data-label]::before {
            content: attr(data-label);
            font-weight: bold;
            color: #007bff;
            margin-right: 1rem;
        }
    }

    .no-logs-message {
        text-align: center;
        margin-top: 2rem;
        font-size: 1.2rem;
        color: #ff0000;
    }

    #search-input {
        width: 250px;
    }

    #refresh-timer {
        font-size: 1.1rem;
        font-weight: 500;
        color: #007bff;
        margin-bottom: 1rem;
        text-align: right;
        display: none;
    }

    #countdown {
        font-weight: bold;
        color: #dc3545;
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.2); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
    }
</style>
{% endblock %}

{% block content %}
<h1>Log List</h1>
<a href="{% url 'home' %}" class="btn btn-primary mt-4">Back to Home</a>
<hr>

<p id="refresh-timer" class="text-muted mb-2">Refreshing in <span id="countdown">5</span> seconds...</p>

<div class="table-container">
    <input type="text" id="search-input" class="form-control mb-2" placeholder="Search logs...">
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-primary">
                <tr>
                    <th scope="col">Activity Type</th>
                    <th scope="col">Message</th>
                    <th scope="col">Timestamp</th>
                </tr>
            </thead>
            <tbody id="logs-table-body">
                <!-- Logs will be populated dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    let allLogs = [];
    let searchQuery = "";
    let fetchInterval;
    let countdownValue = 5;
    let countdownTimer;

    function filterLogs() {
        const filteredLogs = allLogs.filter(log => log.toLowerCase().includes(searchQuery));
        renderLogs(filteredLogs);
    }

    function renderLogs(logs) {
        let tableBody = '';

        if (logs.length > 0) {
            logs.forEach(log => {
                let [logType, ...logMessageParts] = log.split(': ');
                let logMessageAndTimestamp = logMessageParts.join(': ');
                let [logMessage, logTimestamp] = logMessageAndTimestamp.split(' at ');

                tableBody += `<tr>
                    <td>${logType}</td>
                    <td>${logMessage || ''}</td>
                    <td>${logTimestamp || ''}</td>
                </tr>`;
            });
            $('#refresh-timer').show();
        } else {
            tableBody = '<tr><td colspan="3" class="text-center">No logs found</td></tr>';
            $('#refresh-timer').hide();  // Hide timer if no logs
        }

        $('#logs-table-body').html(tableBody);
    }

    function fetchLogs() {
        if (searchQuery) return;

        const email = "{{ user.email }}";

        $.ajax({
            url: '{% url "fetch_logs" %}',
            method: 'GET',
            data: { email: email },
            success: function(data) {
                allLogs = data.logs ? data.logs.reverse() : [];
                renderLogs(allLogs);
                if (allLogs.length === 0) {
                    clearInterval(countdownTimer);
                    $('#refresh-timer').hide();
                } else if (!searchQuery) {
                    startCountdown(); // restart countdown if needed
                }
            },
            error: function() {
                allLogs = [];
                renderLogs([]);
                $('#refresh-timer').hide();
                clearInterval(countdownTimer);
            }
        });
    }

    function startCountdown() {
        clearInterval(countdownTimer);
        countdownValue = 5;
        $('#countdown').text(countdownValue);

        countdownTimer = setInterval(() => {
            countdownValue--;
            $('#countdown').text(countdownValue);
            if (countdownValue <= 0) {
                clearInterval(countdownTimer);
                fetchLogs();
            }
        }, 1000);
    }

    $('#search-input').on("input", function () {
        searchQuery = this.value.toLowerCase();
        if (searchQuery) {
            clearInterval(countdownTimer);
            $('#refresh-timer').hide();
        } else {
            fetchLogs();
            if (allLogs.length > 0) {
                startCountdown();
                $('#refresh-timer').show();
            }
        }
        filterLogs();
    });

    $(document).ready(function () {
        fetchLogs();
    });
</script>
{% endblock %}
